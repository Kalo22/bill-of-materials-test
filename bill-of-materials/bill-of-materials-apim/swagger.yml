          - oauth2
      parameters:
        - name: materialNumber
          in: path
          example: 2410549
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/extendMaterialsForPlant"
      responses:
        "201":
          description: Ok
          content:
