info:
  title: Bill-of-Materials API
  description: This document describe a RESTFul API for Bill Of Materials.
  version: "1.1"
servers:
  - url: https://srv01eisamo1d.corp.trumpf.com/bill-of-materials/1.0
    description: Development server
  - url: https://api-t-restricted.corp.trumpf.com/bill-of-materials/1.0
    description: QA gateway
  - url: https://api-restricted.corp.trumpf.com/bill-of-materials/1.0
    description: Trusted third party production gateway
  - url: https://api-public.corp.trumpf.com/bill-of-materials/1.0
    description: Public production gateway
  - url: https://api-internal.corp.trumpf.com/bill-of-materials/1.0
    description: Internal production gateway
x-wso2-security:
  apim:
    x-wso2-scopes:
      - name: bom:write
        key: bom:write
        description: Right to change material data
        roles: "Internal/bom_write"
      - name: bom:read
        key: bom:read
        description: Right to change material data
        roles: "Internal/bom_read"
paths:
  "/{materialNumber}":
    get:
      summary: Get bill of materials for a material number
      x-scope: bom:read
      tags:
        - bom
      security:
        - default:
            - 'bom:read'
      x-auth-type: Application & Application User
      x-wso2-application-security:
        security-types:
          - oauth2
      parameters:
        - name: materialNumber
          in: path
          example: 2410549
          schema:
            type: string
          required: true
        - name: plant
          in: query
          schema:
            type: string
        - name: bomUsage
          in: query
          schema:
            type: string
            enum:
                  [
                    "1",
                    "2",
                    "'3",
                    "4",
                    "5",
                    "6",
                    "7",
                    "U",
                    "E",
                    "M"
                  ]
            example: 1
          required: true
        - name: bomAlternative
          in: query
          schema:
            type: string
        - name: validFrom
          in: query
          schema:
            type: string
            example: 01.01.1900
          required: true
        - name: validTo
          in: query
          schema:
            type: string
            example: 31.12.9999
        - name: changeNumber
          in: query
          schema:
            type: string
            example: 457-01
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getBomResponse"
        "403":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unauthorized"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/badRequest"
        "404":
          description: BOM Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/notFound"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internalError"
    post:
      summary: Create bill of materials for a material number in SAP
      x-scope: bom:write
      tags:
        - bom
      security:
        - default:
            - 'bom:write'
      x-auth-type: Application & Application User
      x-wso2-application-security:
        security-types:
          - oauth2
      parameters:
        - name: materialNumber
          in: path
          example: 2410549
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/createBomItems"
      responses:
        "201":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createBomItemsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/badRequest"
        "403":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unauthorized"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/conflict"
        "500":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internalError"
    patch:
      summary: update bill of materials items for a material number in SAP
      x-scope: bom:write
      tags:
        - bom
      security:
        - default:
            - 'bom:write'
      x-auth-type: Application & Application User
      x-wso2-application-security:
        security-types:
          - oauth2
      parameters:
        - name: materialNumber
          in: path
          example: 2410549
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/updateBomItems"
      responses:
        "201":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/updateBomItemsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/badRequest"
        "403":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/unauthorized"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/conflict"
        "500":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/internalError"
  /{materialNumber}/boms:
    get:
      summary: Get boms for a material number
      x-scope: bom:read
      tags:
        - bom
      security:
        - default:
            - 'bom:read'
      x-auth-type: Application & Application User
